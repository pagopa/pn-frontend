name: Push locales to Lokalise

on:
  workflow_dispatch:
  push:
    branches:
      # - develop
      # TODO: RIMUOVERE PRIMA DEL MERGE IN develop - serve solo per testare sul branch di feature
      - feature/PN-19913
    paths:
      - 'packages/*/public/locales/it/**'

concurrency:
  group: lokalise-push-${{ github.head_ref || github.run_id }}
  cancel-in-progress: false

permissions:
  # write serve al primo run per creare/pushare il tag 'lokalise-upload-complete'.
  # Dopo che il tag esiste si puo' tornare a 'contents: read' (come io-app).
  contents: write

jobs:
  # Ogni app ha il suo progetto Lokalise, quindi qui rileviamo quali app hanno
  # traduzioni italiane modificate. L'output 'changes' di paths-filter e' gia' un
  # array JSON con i nomi dei filtri che hanno fatto match: lo passiamo tale e quale
  # come matrix del job successivo, cosi' le app non toccate non generano un job.
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ github.event_name == 'workflow_dispatch' && '["PFL","PF","PA","PG"]' || steps.filter.outputs.changes }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Detect apps with changed locales
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            PFL: ['packages/pn-personafisica-login/public/locales/it/**']
            PF: ['packages/pn-personafisica-webapp/public/locales/it/**']
            PA: ['packages/pn-pa-webapp/public/locales/it/**']
            PG: ['packages/pn-personagiuridica-webapp/public/locales/it/**']

  push-locale:
    needs: detect-changes
    if: needs.detect-changes.outputs.apps != '' && needs.detect-changes.outputs.apps != '[]'
    runs-on: ubuntu-latest
    # TODO: RIPRISTINARE PRIMA DEL MERGE - usa secret e variabili di repository durante il test.
    #       Riallineare a io-app con "environment: lokalise" quando l'environment sara' disponibile.
    # environment: lokalise
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.detect-changes.outputs.apps) }}
    env:
      # I codici app sono anche il suffisso delle variabili LOKALISE_PROJECT_ID_<CODICE>.
      PACKAGES: >-
        {
          "PFL": "pn-personafisica-login",
          "PF": "pn-personafisica-webapp",
          "PA": "pn-pa-webapp",
          "PG": "pn-personagiuridica-webapp"
        }
    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Push ${{ matrix.app }} locales to Lokalise
        uses: lokalise/lokalise-push-action@bb67ba45a739acf22e3c00f05dc50a55737fa5c8 #v5.3.1
        with:
          api_token: ${{ secrets.LOKALISE_API_TOKEN }}
          project_id: ${{ vars[format('LOKALISE_PROJECT_ID_{0}', matrix.app)] }}
          base_lang: it
          translations_path: packages/${{ fromJson(env.PACKAGES)[matrix.app] }}/public/locales
          file_ext: json
          # Carica sempre TUTTI i file it/ dell'app in esecuzione, non solo quelli
          # modificati: se cambia common.json vogliamo che l'intero progetto Lokalise
          # dell'app resti allineato (login.json incluso). Lo scope resta comunque la
          # singola app, perche' translations_path punta solo al suo package.
          # Nota: cosi' evitiamo anche il tag 'lokalise-upload-complete', che l'action
          # usa per riconoscere il primo run ma tiene unico per repository e non per
          # progetto (con 4 progetti sarebbe inaffidabile).
          rambo_mode: true
          additional_params: |
            cleanup_mode: true
